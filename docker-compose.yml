
services:
  postgresdb:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: docker
      POSTGRES_DB: weatherstationdb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - springboot-postgres-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: sannidhiharshith/docker-backend-2400032943:latest
    container_name: docker-springboot
    ports:
      - "8081:8081"
    depends_on:
      - postgresdb
    restart: on-failure
    networks:
      - springboot-postgres-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: sannidhiharshith/docker-frontend-2400032943:latest
    container_name: docker-react
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: on-failure
    networks:
      - springboot-postgres-net

volumes:
  postgres_data:

networks:
  springboot-postgres-net:
